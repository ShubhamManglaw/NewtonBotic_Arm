# Must match robot_bringup/config/controllers.yaml controller names exactly.
# Only the arm is executed through MoveIt. The gripper (JointGroupPositionController,
# /gripper_controller/commands) is commanded directly by chess_manipulation.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
