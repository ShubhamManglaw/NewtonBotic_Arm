chess_manipulation:
  ros__parameters:
    # All poses are for the `tcp` frame (between the HELENE finger pads; approach = tcp +X).
    # Heights of the TCP above the board top surface (m):
    approach_height: 0.060     # pre-grasp / retreat, above the grasp point
    transport_height: 0.100    # carrying height. Carried piece bottom = tcp - grasp_height (0.024)
                               # = 0.076, which clears the tallest piece (0.050)
    release_clearance: 0.002   # carried piece's base this far above the board when released
    # The jaw axis is tcp +Y = gripper yaw + 90 deg. With these offsets from the board yaw,
    # the jaws close along a board diagonal, where neighbours are farthest away (42 mm vs 30 mm).
    grasp_yaw_offsets_deg: [45.0, -45.0, 135.0, -135.0, 0.0, 90.0]
    velocity_scaling: 0.4
    acceleration_scaling: 0.4
    stage_timeout: 30.0
    # Arm joints at rest between moves: HELENE "ready" [0, 11, 0.46, 0, -79.46, 0] deg
    # (TCP at (0.232, 0, 0.150), pointing down)
    rest_joints: [0.0, 0.191986, 0.008029, 0.0, -1.386839, 0.0]
    # 'gripper'  : real pure-friction grasp with the HELENE gripper (default)
    # 'teleport' : TEST ONLY. The arm performs every motion but the piece is moved by Gazebo
    #              set_pose at release time. Validates planning and game flow, NOT grasping.
    execution_mode: gripper
    gripper:
      command_topic: /gripper_controller/commands   # std_msgs/Float64MultiArray [finger_r, finger_l]
      joints: [finger_r_joint, finger_l_joint]      # both always commanded equally
      # metres per finger; jaw gap = 2 x value. The piece grasp body is 15 mm in diameter.
      open_position: 0.012       # 24 mm gap for approach and release
      close_position: 0.006      # 12 mm target: squeezes the 15 mm body, force limited by the joint effort
      holding_min_position: 0.0068  # if fingers close past 13.6 mm, nothing is between the pads
      settle_time: 0.3           # s the fingers must be still before the command counts as done
      timeout: 5.0
    place_tolerance: 0.006     # m, max XY error of the placed piece vs square centre
